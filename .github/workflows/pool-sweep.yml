# Pool builder check: every commentary adapter on all 66 books, compared with the recorded baseline.
# Runs on any change to the library, the pool tools or the baseline. No model calls, no network beyond checkout. Read-only.
# The Fathers sweep is not here: it needs the 129 MB pinned HCF copy, which is not kept in this repo.
name: Pool sweep
on:
  push:
    paths: ['library/**', 'tools/pool/**', 'pool/allbooks-baseline.json', 'pool/units.json', 'pool/studies/**', '.github/workflows/pool-sweep.yml']
  pull_request:
    paths: ['library/**', 'tools/pool/**', 'pool/allbooks-baseline.json', 'pool/units.json', 'pool/studies/**', '.github/workflows/pool-sweep.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: No compiled Python files are tracked
        run: |
          if git ls-files | grep -E '__pycache__|\.pyc$'; then echo "Compiled Python files are tracked (listed above). Remove them."; exit 1; fi
      - name: Unit table is well formed (spans, movements tile, named approvals)
        run: python3 -B tools/pool/check_units.py library pool/units.json
      - name: Adapter regression tests (20)
        run: python3 -B tools/pool/run_adapter_tests.py library
      - name: frame_v2 tests (an approval covers every word on a study page)
        run: python3 -B tools/pool/test_frame_v2.py pool/studies/jhn3-16-21/diagnostic-jhn3-16-21-public.json
      - name: Narrative weave tests (each rule catches a weave built to break it)
        run: python3 -B tools/pool/test_weave.py pool/studies/jhn3-16-21/diagnostic-jhn3-16-21-public.json
      - name: Full-study rail tests (each rule catches a study built to break it)
        run: python3 -B tools/pool/test_full_study.py
      - name: Themed study rails
        run: python3 -B tools/pool/test_themed_study.py
      - name: Themed study sets ready (each set's own stand-in passes the rails; no model call)
        run: python3 -B tools/pool/test_themed_sets.py
      - name: Study Worker v1 (offline; serves only approved, hash-checked pages)
        run: node tools/study-worker/test-worker.mjs
      - name: John studies rebuild equals the committed pages and records
        run: |
          # rebuild into a copy of the folder, so recorded approvals are there to be kept (an unchanged study stays approved)
          rm -rf /tmp/jhn-rebuild && cp -r pool/studies/jhn3-16-21 /tmp/jhn-rebuild
          python3 -B tools/pool/build_studies_jhn.py pool/studies/jhn3-16-21/diagnostic-jhn3-16-21-public.json /tmp/jhn-rebuild
          for f in /tmp/jhn-rebuild/*; do cmp "$f" "pool/studies/jhn3-16-21/$(basename "$f")"; done
      - name: Study index equals a fresh build; every approved study is servable
        run: python3 -B tools/pool/study_index.py check
      - name: Whole-Bible sweep equals the baseline (31,103 verses, seven adapters)
        run: python3 -B tools/pool/run_allbooks.py library sweep-out --baseline pool/allbooks-baseline.json
      - name: Sweep table on the run page
        if: always()
        run: test -f sweep-out/allbooks.md && cat sweep-out/allbooks.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Keep the sweep result with the run
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: pool-sweep, path: 'sweep-out/' }
