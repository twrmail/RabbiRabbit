[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public index.html package.json package-lock.json vite.config.js vite.config.ts netlify.toml netlify/functions"

# Icons folder — serve directly before catch-all
[[redirects]]
  from = "/icons/*"
  to = "/icons/:splat"
  status = 200
  force = true

# Catch-all for React Router — must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

