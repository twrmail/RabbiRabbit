[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Icons folder — serve directly before catch-all
[[redirects]]
  from = "/icons/*"
  to = "/icons/:splat"
  status = 200
  force = true

# Catch-all for React Router — must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
