[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  ignore = '''git diff --name-only $CACHED_COMMIT_REF $COMMIT_REF | grep -qvE "^(.github/|tools/|library/|claude/|docs/)" && exit 1 || exit 0'''

# Icons folder — serve directly before catch-all
[[redirects]]
  from = "/icons/*"
  to = "/icons/:splat"
  status = 200
  force = true

# Catch-all for React Router — must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
